name: clean-install

# Install the published extension the way a user does and render with it.
# The test suite runs inside the repository, where `_extensions` and
# `_quarto.yml` are already in place; this proves the *release* is installable.
#
# The weekly run is the point of this workflow: it is what notices a release
# broken by a newer Quarto or PARI/GP, months after the release itself.
# (GitHub disables scheduled workflows after 60 days without repository
# activity, so on a finished project this eventually stops until someone
# pushes or re-enables it.)
#
# The `release: published` trigger below only fires for a release published by
# a person. Ours are created by release.yml with GITHUB_TOKEN, and GitHub does
# not start workflow runs from GITHUB_TOKEN events — that case is covered by
# the verify-install job in release.yml instead.

on:
  release:
    types: [published]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "Release to install (e.g. v0.1.0), or --local for this tree"
        required: false
        default: ""

jobs:
  clean-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Install PARI/GP (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pari-gp

      - name: Install PARI/GP (macOS)
        if: runner.os == 'macOS'
        run: brew install pari

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Report versions
        run: |
          quarto --version
          gp --version 2>&1 | head -3

      # On a release event the tag is what was just published; otherwise the
      # input, and failing that VERSION, which on main is the current release.
      - name: Install the extension and render with it
        run: |
          ref='${{ github.event.inputs.ref }}'
          [ -n "$ref" ] || ref='${{ github.event.release.tag_name }}'
          ./tests/clean-install.sh ${ref:+"$ref"}
